<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar Universo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
    width: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  #universe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: radial-gradient(ellipse at center, #05010f 0%, #000000 100%);
  }

  #ui {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  h1 {
    color: #fff;
    text-shadow: 0 0 20px #a78bfa, 0 0 40px #7c3aed, 0 0 60px #4c1d95;
    font-size: 3vw;
    letter-spacing: 3px;
    margin-bottom: 30px;
    text-align: center;
    transition: opacity 1s ease;
  }

  button {
    pointer-events: all;
    background: linear-gradient(135deg, #7c3aed, #db2777, #f472b6);
    background-size: 200% 200%;
    animation: gradientShift 4s ease infinite;
    border: none;
    color: white;
    font-size: 1.3vw;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 18px 45px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(219, 39, 119, 0.7), 0 0 60px rgba(124, 58, 237, 0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 1s ease;
    text-transform: uppercase;
  }

  button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(219, 39, 119, 0.9), 0 0 80px rgba(124, 58, 237, 0.7);
  }

  button:active {
    transform: scale(0.95);
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .fade-out {
    opacity: 0 !important;
  }

  .heart {
    position: fixed;
    pointer-events: none;
    font-size: 24px;
    z-index: 20;
    user-select: none;
    will-change: transform, opacity;
  }

  #flash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
  }

  @media (max-width: 700px) {
    h1 { font-size: 6vw; }
    button { font-size: 4vw; padding: 15px 30px; }
  }

  .hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    text-shadow: 0 0 10px rgba(124, 58, 237, 0.8);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 15;
    text-align: center;
  }

  .photo-card {
    position: fixed;
    background: #fdfdfd;
    padding: 10px 10px 30px 10px;
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 60px rgba(219,39,119,0.35);
    z-index: 40;
    cursor: grab;
    transform: translate(-50%, -50%) scale(0) rotate(0deg);
    transition: transform 0.6s cubic-bezier(.2,1.4,.4,1), opacity 0.6s ease;
    opacity: 0;
    width: min(220px, 60vw);
    box-sizing: border-box;
    user-select: none;
  }

  .photo-card img {
    display: block;
    width: 100%;
    height: min(260px, 42vh);
    object-fit: cover;
    border-radius: 2px;
    pointer-events: none;
  }

  .photo-card .caption {
    text-align: center;
    color: #444;
    font-size: 13px;
    margin-top: 8px;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .photo-card.show {
    opacity: 1;
  }

  .photo-close {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #db2777;
    color: white;
    border: none;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(219,39,119,0.7);
    z-index: 41;
  }
</style>
</head>
<body>

<canvas id="universe"></canvas>
<audio id="musica/bigbang-audio-1" preload="auto"><source src="musica/bigbang-audio-1.mp3" type="audio/mpeg"></audio>
<div id="flash"></div>

<div id="ui">
  <h1 id="title">GENERAR UNIVERSO</h1>
  <button id="btn">Presióname</button>
</div>

<div id="hint" class="hint"></div>

<script>
const canvas = document.getElementById('universe');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const cx = () => W / 2;
const cy = () => H / 2;

// ---------- Estado ----------
let phase = 'idle'; // idle -> bang -> galaxies
let bangParticles = [];
let galaxies = [];
let backgroundStars = [];

// Estrellas de fondo tenues, siempre presentes
function createBackgroundStars(count) {
  const arr = [];
  for (let i = 0; i < count; i++) {
    arr.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.2,
      alpha: Math.random() * 0.6 + 0.1,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
  return arr;
}
backgroundStars = createBackgroundStars(250);

function drawBackgroundStars(time) {
  for (const s of backgroundStars) {
    const a = s.alpha * (0.6 + 0.4 * Math.sin(time * s.twinkleSpeed + s.twinklePhase));
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Big Bang ----------
function triggerBigBang() {
  phase = 'bang';
  bangParticles = [];
  const colors = ['#ffffff', '#ffe9c7', '#ffd1f0', '#c7b8ff', '#a7f3ff', '#ffd6e0'];
  const count = 900;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 14 + 3;
    bangParticles.push({
      x: cx(),
      y: cy(),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: Math.random() * 2.5 + 0.8,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1
    });
  }

  // flash blanco
  const flash = document.getElementById('flash');
  flash.style.transition = 'opacity 0.08s ease';
  flash.style.opacity = '1';
  setTimeout(() => {
    flash.style.transition = 'opacity 1.2s ease';
    flash.style.opacity = '0';
  }, 90);

  // después de la explosión, formar galaxias
  setTimeout(createGalaxies, 1400);
}

// ---------- Galaxias ----------
function createGalaxies() {
  phase = 'galaxies';
  galaxies = [];
  const galaxyCount = 6;
  const galaxyColors = [
    ['#ff9ad5', '#c084fc', '#7c3aed'],
    ['#7dd3fc', '#a78bfa', '#f472b6'],
    ['#fbbf24', '#f472b6', '#a78bfa'],
    ['#86efac', '#7dd3fc', '#c084fc'],
    ['#f472b6', '#fbbf24', '#a78bfa']
  ];

  for (let g = 0; g < galaxyCount; g++) {
    const maxRPreview = Math.random() * 90 + 70;
    const minGap = maxRPreview * 2 + 90; // separación mínima entre centros

    let gx, gy, tries = 0, ok = false;
    do {
      gx = W * (0.15 + Math.random() * 0.7);
      gy = H * (0.15 + Math.random() * 0.7);
      ok = true;
      for (const other of galaxies) {
        const d = Math.hypot(gx - other.x, gy - other.y);
        if (d < minGap) { ok = false; break; }
      }
      tries++;
    } while (!ok && tries < 60);
    const arms = 3 + Math.floor(Math.random() * 2);
    const starsPerArm = 140;
    const rotation = Math.random() * Math.PI * 2;
    const rotSpeed = (Math.random() * 0.0006 + 0.0002) * (Math.random() < 0.5 ? 1 : -1);
    const maxR = maxRPreview;
    const colorSet = galaxyColors[g % galaxyColors.length];

    const stars = [];
    for (let a = 0; a < arms; a++) {
      const armOffset = (Math.PI * 2 / arms) * a;
      for (let i = 0; i < starsPerArm; i++) {
        const t = i / starsPerArm;
        const dist = t * maxR;
        const spiralAngle = armOffset + t * 6.5;
        const spread = (Math.random() - 0.5) * (0.35 + t * 0.5);
        stars.push({
          angle: spiralAngle + spread,
          dist: dist + (Math.random() - 0.5) * 10,
          size: Math.random() * 1.6 + 0.4,
          color: colorSet[Math.floor(Math.random() * colorSet.length)],
          alpha: Math.random() * 0.5 + 0.5
        });
      }
    }

    galaxies.push({
      x: gx, y: gy, rotation, rotSpeed, stars,
      coreGlowColor: colorSet[1],
      scale: 0,
      targetScale: 1,
      pulsePhase: Math.random() * Math.PI * 2,
      clickRadius: maxR + 40,
      opened: false
    });
  }
}

function drawGalaxies(time) {
  for (const gal of galaxies) {
    if (gal.scale < gal.targetScale) gal.scale += 0.02;
    gal.rotation += gal.rotSpeed * 16;

    ctx.save();
    ctx.translate(gal.x, gal.y);
    ctx.rotate(gal.rotation);
    ctx.scale(gal.scale, gal.scale);

    // núcleo brillante
    const pulse = 1 + 0.15 * Math.sin(time * 0.002 + gal.pulsePhase);
    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 26 * pulse);
    coreGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
    coreGrad.addColorStop(0.3, gal.coreGlowColor + 'cc');
    coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.fillStyle = coreGrad;
    ctx.arc(0, 0, 26 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // estrellas del brazo espiral
    for (const s of gal.stars) {
      const x = Math.cos(s.angle) * s.dist;
      const y = Math.sin(s.angle) * s.dist * 0.55; // achatar para efecto de disco
      ctx.beginPath();
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.alpha;
      ctx.arc(x, y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// ---------- Loop principal ----------
let lastTime = 0;
function animate(time) {
  ctx.fillStyle = 'rgba(2, 0, 8, 0.35)';
  ctx.fillRect(0, 0, W, H);

  drawBackgroundStars(time);

  if (phase === 'bang') {
    let alive = false;
    for (const p of bangParticles) {
      if (p.life <= 0) continue;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= 0.006;

      ctx.beginPath();
      ctx.globalAlpha = Math.max(p.life, 0);
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      grad.addColorStop(0, p.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  if (phase === 'galaxies') {
    drawGalaxies(time);
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---------- Corazones ----------
function spawnHearts() {
  const heartsEmojis = ['💖', '💕', '💗', '💓', '💞', '❤️', '💜', '💙'];
  const total = 40;
  for (let i = 0; i < total; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = heartsEmojis[Math.floor(Math.random() * heartsEmojis.length)];
      const startX = Math.random() * window.innerWidth;
      h.style.left = startX + 'px';
      h.style.top = window.innerHeight + 20 + 'px';
      h.style.fontSize = (Math.random() * 20 + 16) + 'px';
      h.style.opacity = '1';
      document.body.appendChild(h);

      const drift = (Math.random() - 0.5) * 200;
      const duration = Math.random() * 3000 + 3500;
      const rise = window.innerHeight + 100;

      h.animate([
        { transform: `translate(0px, 0px) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${drift}px, -${rise}px) rotate(${(Math.random() - 0.5) * 360}deg)`, opacity: 0 }
      ], {
        duration: duration,
        easing: 'ease-out',
        fill: 'forwards'
      });

      setTimeout(() => h.remove(), duration + 100);
    }, i * 80);
  }
}

// ---------- Botón ----------
const btn = document.getElementById('btn');
const title = document.getElementById('title');
const hint = document.getElementById('hint');
const bgMusic = document.getElementById('musica/bigbang-audio-1');
let used = false;

btn.addEventListener('click', () => {
  if (used) return;
  used = true;

  // 🎵 Iniciar la música al presionar el botón
  bgMusic.currentTime = 0;
  bgMusic.volume = 0.7;
  bgMusic.play().catch(error => {
    console.log('No se pudo reproducir la música:', error);
  });

  title.textContent = '¡EL UNIVERSO HA NACIDO!';
  title.classList.add('fade-out');
  btn.classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('ui').style.display = 'none';
  }, 2000);

  triggerBigBang();
  spawnHearts();

  // Sincronización exacta de subtítulos al ritmo de la canción
  const hintEl = document.getElementById('hint');

  // Frase 1
  setTimeout(() => { 
      hintEl.textContent = "Te amo❤️";
      hintEl.style.opacity = '9'; 
  }, 1700);
});

// ---------- Fotos dentro de las galaxias ----------
const memoryPhotos = [
{ src: 'fotos/foto1.jpeg', caption: '🍜 comida con mi amoshito❤️' },
{ src: 'fotos/foto2.jpeg', caption: '🌌 vista del universo desde la tierra' },
{ src: 'fotos/foto3.jpeg', caption: '🌠 estrellas fugaces en el cielo' },
{ src: 'fotos/foto4.jpeg', caption: '🌅 atardecer en el horizonte' },
{ src: 'fotos/foto5.jpeg', caption: '🐈‍⬛🐼 perfecta combinación❤️' }
];
let photoIndex = 0;
let openCard = null;

function openPhotoCard(x, y) {
  if (openCard) {
    openCard.remove();
    openCard = null;
  }
  const photo = memoryPhotos[photoIndex % memoryPhotos.length];
  photoIndex++;

  const card = document.createElement('div');
  card.className = 'photo-card';
  const rot = (Math.random() - 0.5) * 12;

  const cardW = Math.min(220, window.innerWidth * 0.6);
  const cardH = Math.min(260, window.innerHeight * 0.42) + 60; 
  const margin = 30; 

  const clampedX = Math.min(
    Math.max(x, cardW / 2 + margin),
    window.innerWidth - cardW / 2 - margin
  );
  const clampedY = Math.min(
    Math.max(y, cardH / 2 + margin),
    window.innerHeight - cardH / 2 - margin
  );

  card.style.left = clampedX + 'px';
  card.style.top = clampedY + 'px';
  card.style.setProperty('--rot', rot + 'deg');

  card.innerHTML = `
    <button class="photo-close">✕</button>
    <img src="${photo.src}" alt="recuerdo">
    <div class="caption">${photo.caption}</div>
  `;
  document.body.appendChild(card);
  openCard = card;

  requestAnimationFrame(() => {
    card.classList.add('show');
    card.style.transform = `translate(-50%, -50%) scale(1) rotate(${rot}deg)`;
  });

  card.querySelector('.photo-close').addEventListener('click', (e) => {
    e.stopPropagation();
    card.style.transform = `translate(-50%, -50%) scale(0) rotate(${rot}deg)`;
    card.classList.remove('show');
    setTimeout(() => card.remove(), 500);
    if (openCard === card) openCard = null;
  });
}

canvas.addEventListener('click', (e) => {
  if (phase !== 'galaxies') return;
  const mx = e.clientX;
  const my = e.clientY;
  for (const gal of galaxies) {
    const d = Math.hypot(mx - gal.x, my - gal.y);
    if (d < gal.clickRadius) {
      openPhotoCard(gal.x, gal.y);
      break;
    }
  }
});
</script>

</body>
</html>
