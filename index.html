<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generar Universo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="universe"></canvas>
<audio id="bg-music" preload="auto">
  <source src="musica/bigbang-audio-1.mp3" type="audio/mpeg">
</audio>
<div id="flash"></div>

<div id="ui">
  <h1 id="title">GENERAR UNIVERSO</h1>
  <button id="btn">Presióname</button>
</div>

<div id="hint" class="hint"></div>

<div class="floating-container">
  <button id="btn-camera" class="btn-action">Cabina de Fotos</button>
  <button id="btn-ver-mas" class="btn-action">Ver más</button>
</div>

<div id="purple-screen">
  <div class="love-message">
    Y aparecerá aquí la mayor fan de Melanie Martinez, Lizeth Alessandra Ramirez Castillo, 
    la cual por sus canciones... ¡ilumina todo su universo entero!❤️🐈‍⬛🐕
  </div>
  <button class="purple-back-btn" id="btn-volver">Volver al universo</button>
</div>

<div id="camera-modal">
  <img src="fotos/melanie1.jpg" class="bg-floating-photo" style="top: 10%; left: 15%; animation-duration: 8s;">
  <img src="fotos/melanie2.jpg" class="bg-floating-photo" style="top: 70%; left: 10%; animation-duration: 12s;">
  <img src="fotos/melanie3.jpg" class="bg-floating-photo" style="top: 20%; right: 15%; animation-duration: 9s;">
  <img src="fotos/melanie4.jpg" class="bg-floating-photo" style="top: 65%; right: 12%; animation-duration: 11s;">

  <div class="camera-container">
    <video id="camera-stream" autoplay playsinline></video>
    <canvas id="snapshot-canvas" class="snapshot-canvas" style="display:none;"></canvas>
    
    <div class="camera-buttons">
      <button id="btn-capture" style="font-size: 1vw; padding: 10px 20px;">Capturar</button>
      <a id="btn-download" style="display:none;" download="collage-melanie.jpg">
        <button style="font-size: 1vw; padding: 10px 20px; background: linear-gradient(135deg, #059669, #10b981);">Descargar Collage</button>
      </a>
      <button id="btn-retake" style="display:none; font-size: 1vw; padding: 10px 20px; background: linear-gradient(135deg, #d97706, #f59e0b);">Otra</button>
      <button id="btn-close-camera" style="font-size: 1vw; padding: 10px 20px; background: #6b7280;">Cerrar</button>
    </div>
  </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
